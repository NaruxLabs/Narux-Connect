<style>
:root{--bg:#F1F4EE;--card:#fff;--ink:#14201B;--mute:#66766D;--pitch:#0F3D2E;--on:#fff;--amber:#E8A92B;--line:#D9E0D6;--bad:#B3361F;--ok:#1E7A4D}
@media (prefers-color-scheme:dark){:root{--bg:#0E1713;--card:#16241D;--ink:#EAF1EC;--mute:#8FA398;--pitch:#2FA070;--on:#07140E;--line:#25382E;--bad:#F0866F;--ok:#5FD39B}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:700}
.sub{color:var(--mute);margin:4px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button,input,select{font:inherit;color:inherit}
button{background:var(--pitch);color:var(--on);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sm{min-height:36px;padding:6px 10px;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
input,select,textarea{width:100%;font-family:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;margin:4px 0 12px}
label{font-size:14px;color:var(--mute)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--amber);color:#2b1d00}
.tag.g{background:var(--line);color:var(--ink)}
.tabs{display:flex;gap:6px;margin:16px 0;overflow-x:auto}img.av{object-fit:cover}.av{width:44px;height:44px;border-radius:50%;background:var(--pitch);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.tabs button{flex:1;white-space:nowrap;padding:8px 10px;background:transparent;color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--pitch);color:var(--on);border-color:var(--pitch)}
.sc{display:flex;gap:6px;align-items:center}.sc input{width:56px;text-align:center;margin:0}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left;width:38%}th{color:var(--mute);font-weight:600;font-size:13px}
.wrap{overflow-x:auto}.mute{color:var(--mute)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.empty{text-align:center;padding:28px 12px;color:var(--mute)}
.app{display:flex;min-height:100vh}.app main{flex:1;min-width:0}
.side{width:200px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:18px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{font:800 20px 'Bricolage Grotesque',system-ui,sans-serif;color:var(--pitch);margin:0 8px 14px;line-height:1.1}
.nv{display:flex;gap:10px;align-items:center;justify-content:flex-start;background:transparent;color:var(--ink);text-align:left;padding:10px}.nv.on{background:var(--pitch);color:var(--on)}
tr.zq{background:rgba(30,122,77,.14)}tr.zr{background:rgba(179,54,31,.14)}tr.zq td:first-child{box-shadow:inset 4px 0 var(--ok)}tr.zr td:first-child{box-shadow:inset 4px 0 var(--bad)}
@media(max-width:760px){.app{display:block}.side{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}.brand{display:none}.nv{flex-direction:column;gap:0;padding:4px;flex:1;font-size:12px;min-height:50px;justify-content:center;align-items:center}main{padding-bottom:96px!important}}

<script>
var sb=supabase.createClient('https://mmstudawujwfotiksphf.supabase.co','sb_publishable_NiA2TbTlw6_C12VfM4uGMw_VIo5b_Sg');
var S={user:null,tid:null,tab:'teams',d:null,list:[],msg:'',form:null,auth:'login',notes:[],unread:0,view:null,page:'home',mine:{}};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function v(id){return $(id).value.trim()}
function num(id){var x=$(id).value;return x===''?null:parseInt(x,10)}
function err(e){S.msg=e&&e.message?e.message:String(e);render()}
function idLabel(g){return g==='eFootball'?'eFootball ID':'DLS ID'}

async function loadList(){
  var r=await sb.from('tournaments').select('*, teams!teams_tournament_id_fkey(count)').order('created_at',{ascending:false});
  if(r.error)return err(r.error);S.list=r.data;S.mine={};if(S.user){var q=await sb.from('teams').select('tournament_id').eq('owner_id',S.user.id);(q.data||[]).forEach(function(x){S.mine[x.tournament_id]=1})}render()}
async function loadT(){
  var id=S.tid;
  var r=await Promise.all([sb.from('tournaments').select('*').eq('id',id).maybeSingle(),
    sb.from('teams').select('*').eq('tournament_id',id).order('created_at'),
    sb.from('fixtures').select('*').eq('tournament_id',id).order('created_at'),
    sb.from('standings').select('*').eq('tournament_id',id),
    S.user?sb.from('team_private').select('team_id,phone'):Promise.resolve({data:[]}),
    sb.from('announcements').select('*').eq('tournament_id',id).order('created_at',{ascending:false}).limit(5)]);
  for(var i=0;i<6;i++)if(r[i].error)return err(r[i].error);
  if(!r[0].data){S.msg='Tournament not found.';S.tid=null;return loadList()}
  var pv={};(r[4].data||[]).forEach(function(x){pv[x.team_id]=x.phone});S.d={an:r[5].data||[],pv:pv,t:r[0].data,teams:r[1].data,fx:srt(r[2].data),st:r[3].data};render()}
function route(){S.view=null;S.tid=location.hash.slice(1)||null;S.msg='';S.tab='teams';S.tid?loadT():loadList()}
function open_(id){location.hash=id}
function home(){history.pushState('',document.title,location.pathname);route()}

async function doAuth(){
  var e=v('em'),p=$('pw').value,r;S.msg='';
  if(S.auth==='signup'){
    var u=v('un');if(!u)return err('Choose a username.');
    r=await sb.auth.signUp({email:e,password:p,options:{data:{username:u}}});
    if(!r.error&&!r.data.session){S.msg='Account created. Check your email to confirm, then log in.';S.auth='login';return render()}
  }else r=await sb.auth.signInWithPassword({email:e,password:p});
  if(r.error)return err(r.error)}
async function logout(){await sb.auth.signOut()}

async function createT(){
  var n=v('tn');if(!n)return err('Enter a tournament name.');
  var fm=$('tf').value,ql=parseInt($('tq').value,10)||0,rl=parseInt($('tr').value,10)||0,mx=+$('tm').value;if(fm==='league_knockout'&&[2,4,8,16].indexOf(ql)<0)return err('Choose 2, 4, 8 or 16 qualifying teams.');if(ql+rl>mx)return err('Qualifying plus relegated teams cannot be more than the maximum teams.');var r=await sb.from('tournaments').insert({name:n,game:$('tg').value,format:fm,visibility:$('tv').value,qualifiers:ql,relegated:rl,max_teams:mx,organiser_id:S.user.id}).select().single();
  if(r.error)return err(r.error);S.form=null;open_(r.data.id)}
async function join(){
  var t=S.d.t,n=v('jn'),g=v('ji');if(!n||!g)return err('Enter a team name and '+idLabel(t.game)+'.');
  var guest=$('jg')&&$('jg').checked;
  var r=await sb.from('teams').insert({tournament_id:t.id,name:n,game_id:g,country:cname(v('jc')),owner_id:guest?null:S.user.id}).select('id').single();
  if(r.error)return err(r.error.code==='23505'?'That team name or ID is already registered.':r.error);var ph=v('jp').replace(/\D/g,'').replace(/^0+/,'');ph=ph?'+'+codeOf(v('jc'))+ph:'';if(ph){var q=await sb.from('team_private').insert({team_id:r.data.id,phone:ph});if(q.error)return err(q.error)}S.msg='';loadT()}
async function rpc(fn,args){var r=await sb.rpc(fn,args);if(r.error)return err(r.error);S.msg='';loadT()}
function startT(){rpc('start_tournament',{t:S.tid})}
function submit_(f){var h=num('h'+f),a=num('a'+f);if(h===null||a===null||isNaN(h)||isNaN(a))return err('Enter both scores.');rpc('submit_result',{f:f,h:h,a:a})}
function confirm_(f){rpc('confirm_result',{f:f})}
function dispute(f){rpc('dispute_result',{f:f})}
function resolve(f){var h=num('h'+f),a=num('a'+f);if(h===null||a===null)return err('Enter the final score.');rpc('resolve_result',{f:f,h:h,a:a})}
var DC='AF93 AL355 DZ213 AD376 AO244 AR54 AM374 AU61 AT43 AZ994 BS1242 BH973 BD880 BB1246 BY375 BE32 BZ501 BJ229 BT975 BO591 BA387 BW267 BR55 BN673 BG359 BF226 BI257 KH855 CM237 CA1 CV238 CF236 TD235 CL56 CN86 CO57 KM269 CG242 CD243 CR506 CI225 HR385 CU53 CY357 CZ420 DK45 DJ253 DM1767 DO1809 EC593 EG20 SV503 GQ240 ER291 EE372 SZ268 ET251 FJ679 FI358 FR33 GA241 GM220 GE995 DE49 GH233 GR30 GD1473 GT502 GN224 GW245 GY592 HT509 HN504 HU36 IS354 IN91 ID62 IR98 IQ964 IE353 IL972 IT39 JM1876 JP81 JO962 KZ7 KE254 KI686 KW965 KG996 LA856 LV371 LB961 LS266 LR231 LY218 LI423 LT370 LU352 MG261 MW265 MY60 MV960 ML223 MT356 MH692 MR222 MU230 MX52 FM691 MD373 MC377 MN976 ME382 MA212 MZ258 MM95 NA264 NR674 NP977 NL31 NZ64 NI505 NE227 NG234 KP850 MK389 NO47 OM968 PK92 PW680 PS970 PA507 PG675 PY595 PE51 PH63 PL48 PT351 QA974 RO40 RU7 RW250 KN1869 LC1758 VC1784 WS685 SM378 ST239 SA966 SN221 RS381 SC248 SL232 SG65 SK421 SI386 SB677 SO252 ZA27 KR82 SS211 ES34 LK94 SD249 SR597 SE46 CH41 SY963 TW886 TJ992 TZ255 TH66 TL670 TG228 TO676 TT1868 TN216 TR90 TM993 TV688 UG256 UA380 AE971 GB44 US1 UY598 UZ998 VU678 VA39 VE58 VN84 YE967 ZM260 ZW263'.split(' ').map(function(x){return{c:x.slice(0,2),d:x.slice(2)}});
var CN;try{CN=new Intl.DisplayNames(['en'],{type:'region'})}catch(e){}
function cname(i){try{return CN.of(i)}catch(e){return i}}
function codeOf(i){var f=DC.find(function(x){return x.c===i});return f?f.d:''}
function countryOpts(){return DC.map(function(x){return{c:x.c,n:cname(x.c)}}).sort(function(a,b){return a.n.localeCompare(b.n)}).map(function(o){return '<option value="'+o.c+'"'+(o.c==='TZ'?' selected':'')+'>'+esc(o.n)+'</option>'}).join('')}
function onCountry(){$('pc').textContent='+'+codeOf(v('jc'))}
async function joinCode(){var c=v('ic').toUpperCase();if(!c)return err('Enter the invitation code.');var r=await sb.rpc('join_by_code',{code:c});if(r.error)return err(r.error);open_(r.data)}
function pickLogo(id){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){var f=i.files[0];if(!f)return;var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);c.toBlob(async function(b){var path=id+'-'+Date.now()+'.jpg';var u=await sb.storage.from('logos').upload(path,b,{contentType:'image/jpeg'});if(u.error)return err(u.error);var url=sb.storage.from('logos').getPublicUrl(path).data.publicUrl;var r=await sb.from('teams').update({logo_url:url}).eq('id',id);if(r.error)return err(r.error);loadT()},'image/jpeg',.85)};im.src=URL.createObjectURL(f)};i.click()}
async function postNews(){var m=v('nm');if(!m)return err('Write the announcement first.');var r=await sb.from('announcements').insert({tournament_id:S.tid,message:m,warning:$('nw').checked});if(r.error)return err(r.error);S.msg='Posted. Players were notified.';loadT()}
function newsHtml(d,org){return '<div class="card"><h3>Announcements</h3><div style="height:6px"></div>'+(d.an.length?d.an.map(function(a){return '<p style="margin:0 0 8px">'+(a.warning?'<span class="tag">Warning</span> ':'')+esc(a.message)+' <span class="mute">'+fmt(a.created_at)+'</span></p>'}).join(''):'<span class="mute">No announcements yet.</span>')+(org?'<div style="height:10px"></div><label for="nm">Post to all players</label><textarea id="nm" rows="2" maxlength="300"></textarea><label><input id="nw" type="checkbox" style="width:auto;min-height:0;margin:0 8px 0 0">Send as a warning</label><div style="height:10px"></div><button class="sm" onclick="postNews()">Post</button>':'')+'</div>'}
function awardsHtml(){var d=S.d,cs={};d.fx.forEach(function(f){if(f.status!=='verified')return;if(f.away_score===0)cs[f.home_team]=(cs[f.home_team]||0)+1;if(f.home_score===0)cs[f.away_team]=(cs[f.away_team]||0)+1});
  var P=d.st.filter(function(r){return r.played>0});
  function board(t,sub,arr,val,unit){return '<div class="card"><h3>'+t+'</h3><div class="mute" style="margin-bottom:6px">'+sub+'</div>'+(arr.length?arr.slice(0,3).map(function(r,i){return '<div class="row"><span>'+(i+1)+'. '+esc(r.name)+'</span><strong>'+val(r)+' '+unit+'</strong></div>'}).join(''):'<span class="mute">No verified results yet.</span>')+'</div>'}
  var a=P.slice().sort(function(x,y){return y.gf-x.gf}),b=P.slice().sort(function(x,y){return x.ga-y.ga||y.played-x.played}),c=P.map(function(r){return{name:r.name,n:cs[r.team_id]||0}}).sort(function(x,y){return y.n-x.n});
  return '<h2 style="margin:18px 0 10px">Awards</h2>'+board('Golden Boot','Best attack: most goals scored',a,function(r){return r.gf},'goals')+board('Best Defender','Fewest goals conceded',b,function(r){return r.ga},'conceded')+board('Golden Glove','Most clean sheets',c,function(r){return r.n},'clean sheets')}
function uname(){var u=S.user;return u?((u.user_metadata&&u.user_metadata.username)||(u.email||'').split('@')[0]):''}
function renderNav(){var n=$('nav');if(!n)return;var it=[['home','\uD83C\uDFE0','Home'],['tours','\uD83C\uDFC6','Leagues'],['notes','\uD83D\uDD14','Alerts'],['profile','\uD83D\uDC64','Profile']];
  n.innerHTML='<div class="brand">Narux<br>Connect</div>'+it.map(function(x){var on=x[0]==='notes'?S.view==='notes':(S.view!=='notes'&&((!S.tid&&S.page===x[0])||(S.tid&&x[0]==='tours')));return '<button class="nv'+(on?' on':'')+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span><small>'+x[2]+(x[0]==='notes'&&S.unread?' ('+S.unread+')':'')+'</small></button>'}).join('')}
function go(p){if(p==='notes'){if(!S.user){S.page='home';return render()}return toggleNotes()}S.view=null;S.page=p;if(S.tid){history.pushState('',document.title,location.pathname);route()}else render()}
function tCard(x){var c=x.teams&&x.teams[0]?x.teams[0].count:0;return '<div class="card"><div class="row"><h3>'+esc(x.name)+'</h3><span><span class="tag">'+x.game+'</span> '+(x.visibility==='private'?'<span class="tag g">Private</span>':'')+'</span></div><div class="row" style="margin-top:8px"><span class="mute">'+c+' / '+x.max_teams+' teams - '+({league:'League',knockout:'Knockout',league_knockout:'League + Knockout'}[x.format]||'League')+' - '+(x.status==='registration'?'Registration open':x.status==='running'?'Running':'Finished')+'</span><button class="sm" onclick="open_(\''+x.id+'\')">Open</button></div></div>'}
function pageHtml(top,m){var u=S.user,uid=u&&u.id,L=S.list.filter(function(x){return x.status!=='cancelled'});
  var mine=L.filter(function(x){return uid&&(x.organiser_id===uid||S.mine[x.id]||x.visibility==='private')}),pub=L.filter(function(x){return x.visibility==='public'&&mine.indexOf(x)<0});
  var list=function(a,e){return a.length?a.map(tCard).join(''):'<div class="empty">'+e+'</div>'};
  var box='<div class="card"><label for="ic">Have an invitation code?</label><div class="row" style="flex-wrap:nowrap"><input id="ic" maxlength="10" style="margin:0" placeholder="Enter code"><button onclick="joinCode()">Open</button></div></div>';
  var H2='<h2 style="margin:16px 0 10px">';
  if(!u)return top+'<p class="sub">Run DLS and eFootball tournaments in one place.</p>'+m+authHtml()+H2+'Public leagues</h2>'+list(pub,'No public leagues yet.');
  if(S.page==='profile')return top+'<h2>Profile</h2>'+m+'<div class="card"><strong>'+esc(uname())+'</strong><div class="mute">'+esc(u.email)+'</div><div style="height:12px"></div><button class="alt" onclick="logout()">Log out</button></div>';
  if(S.page==='tours'){var f=S.form?'<div class="card"><label for="tn">Tournament name</label><input id="tn" maxlength="40"><label for="tg">Game</label><select id="tg"><option>DLS</option><option>eFootball</option></select><label for="tf">Format</label><select id="tf"><option value="league">League</option><option value="knockout">Knockout</option><option value="league_knockout">League, then Knockout</option></select><label for="tm">Maximum teams</label><select id="tm"><option>4</option><option>6</option><option selected>8</option><option>16</option><option>32</option></select><label for="tv">Who can join</label><select id="tv"><option value="public">Public: anyone can join</option><option value="private">Private: join with a code</option></select><label for="tq">Teams that qualify or are promoted (top)</label><input id="tq" type="number" min="0" max="16" value="0" inputmode="numeric"><div class="mute" style="margin:-8px 0 12px">For League, then Knockout use 2, 4, 8 or 16.</div><label for="tr">Teams relegated (bottom)</label><input id="tr" type="number" min="0" max="16" value="0" inputmode="numeric"><button onclick="createT()">Create tournament</button></div>':'';
    return top+m+'<button onclick="S.form=!S.form;render()">'+(S.form?'Cancel':'Create tournament')+'</button><div style="height:14px"></div>'+f+box+H2+'My leagues</h2>'+list(mine,'You have not joined any league yet.')+H2+'Public leagues</h2>'+list(pub,'No public leagues yet.')}
  return top+'<div class="card" style="background:var(--pitch);color:var(--on)"><h2>Welcome, '+esc(uname())+'</h2><p style="margin:6px 0 14px">Ready to create or join a tournament?</p><div class="row" style="justify-content:flex-start"><button class="alt" style="color:var(--on);border-color:var(--on)" onclick="S.form=true;S.page=\'tours\';render()">Create tournament</button><button class="alt" style="color:var(--on);border-color:var(--on)" onclick="go(\'tours\')">Browse leagues</button></div></div>'+m+box+H2+'My leagues</h2>'+list(mine.slice(0,3),'No leagues yet. Create one or join with a code.')+H2+'Open public leagues</h2>'+list(pub.slice(0,4),'No public leagues yet.')}
function legend(t){return (t.qualifiers||t.relegated)?'<p class="mute">'+(t.qualifiers?'Q = qualifies (green, top '+t.qualifiers+')':'')+(t.qualifiers&&t.relegated?' &nbsp; ':'')+(t.relegated?'R = relegated (red, bottom '+t.relegated+')':'')+'</p>':''}
function grp(a){var out='',last=null;a.forEach(function(f){var k=f.stage==='knockout'?(f.round_name||'Knockout'):(f.matchday?'Matchday '+f.matchday:'Matches');if(k!==last){out+='<h3 style="margin:14px 0 8px">'+k+'</h3>';last=k}out+=fxHtml(f)});return out}
function srt(a){return a.slice().sort(function(x,y){return (x.stage===y.stage?0:x.stage==='league'?-1:1)||(x.matchday||0)-(y.matchday||0)||(x.created_at<y.created_at?-1:1)})}
function champHtml(d){var c=d.t.champion_team&&d.teams.find(function(x){return x.id===d.t.champion_team});return c?'<div class="card" style="border-color:var(--amber)"><h3>\uD83C\uDFC6 Champion: '+esc(c.name)+'</h3></div>':''}
function stageBtn(d,org){var t=d.t;if(!org||t.status!=='running'||t.format==='league'||!d.fx.length)return '';var ko=d.fx.some(function(f){return f.stage==='knockout'});return '<div class="card"><h3>Knockout stage</h3><p class="mute">'+(ko?'When every match in the round is verified (and draws have a winner), create the next round.':'When all league matches are verified, the top '+t.qualifiers+' teams go through.')+'</p><button onclick="advance()">'+(ko?'Create next round':'Start knockout stage')+'</button></div>'}
function advance(){rpc('advance_stage',{t:S.tid})}
function setWinner(f,w){rpc('set_ko_winner',{f:f,w:w})}
async function delTour(){var n=prompt('Type the tournament name to confirm deleting it:');if(n===null)return;if(n.trim()!==S.d.t.name)return err('The name did not match. Nothing was deleted.');var r=await sb.rpc('delete_tournament',{t:S.tid});if(r.error)return err(r.error);alert(r.data==='archived'?'League archived (it had verified results).':'League deleted.');home()}
function verify(f){rpc('verify_result',{f:f})}
function saveRules(){sb.from('tournaments').update({rules:$('ru').value}).eq('id',S.tid).then(function(r){if(r.error)return err(r.error);S.msg='Rules saved.';loadT()})}
async function loadNotes(){if(!S.user)return;var r=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(30);if(r.error)return;S.notes=r.data;S.unread=r.data.filter(function(n){return !n.read}).length;document.title=(S.unread?'('+S.unread+') ':'')+'Pre NaruxConnect';renderNav();if(S.view==='notes')render();else if($('bell'))$('bell').textContent='\uD83D\uDD14 '+S.unread}
async function toggleNotes(){if(S.view){S.view=null;render();return}S.view='notes';render();await sb.from('notifications').update({read:true}).eq('user_id',S.user.id).eq('read',false);S.unread=0;document.title='Pre NaruxConnect';renderNav()}
function notesHtml(){return '<div style="height:10px"></div><button class="sm alt" onclick="toggleNotes()">Back</button><h2 style="margin:14px 0 10px">Notifications</h2>'+(S.notes.length?S.notes.map(function(n){return '<div class="card" style="'+(n.read?'':'border-left:4px solid var(--amber)')+'"><div>'+esc(n.message)+'</div><div class="row" style="margin-top:6px"><span class="mute">'+fmt(n.created_at)+'</span>'+(n.tournament_id?'<button class="sm" onclick="S.view=null;open_(\''+n.tournament_id+'\');render()">Open</button>':'')+'</div></div>'}).join(''):'<div class="empty">No notifications yet.</div>')}
function teamCard(x){var d=S.d,t=d.t,u=S.user,org=u&&u.id===t.organiser_id,own=u&&x.owner_id===u.id,mem=org||(u&&d.teams.some(function(y){return y.owner_id===u.id})),ph=d.pv[x.id];
  var st=d.st.find(function(r){return r.team_id===x.id}),rt=st&&st.played?Math.round(st.points/(st.played*3)*100)+'%':'-';
  var av=x.logo_url?'<img class="av" src="'+esc(x.logo_url)+'" alt="">':'<div class="av">'+esc(x.name.slice(0,2).toUpperCase())+'</div>';
  return '<div class="card"><div class="row" style="flex-wrap:nowrap;justify-content:flex-start">'+av+'<div style="flex:1;min-width:0"><strong>'+esc(x.name)+'</strong><div class="mute">'+esc(x.country||'Country not set')+' - Rating '+rt+'</div><div class="mute">'+(mem?idLabel(t.game)+': '+esc(x.game_id)+(ph?' - Phone: <a href="tel:'+esc(ph)+'">'+esc(ph)+'</a>':''):'Join the tournament to see contact details')+'</div></div><span class="tag g">'+(t.status==='registration'?'Registered':'Active')+'</span></div>'+((own||org)?'<div class="row" style="margin-top:8px;justify-content:flex-start"><button class="sm alt" onclick="pickLogo(\''+x.id+'\')">Change logo</button>'+(org?'<button class="sm alt" onclick="removeTeam(\''+x.id+'\')">Remove</button>':'')+'</div>':'')+'</div>'}
function fmt(x){return x?new Date(x).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):null}
function iso(id){var x=$(id).value;return x?new Date(x).toISOString():null}
function toLocal(x){if(!x)return '';var d=new Date(x),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function removeTeam(id){var t=S.d.teams.find(function(x){return x.id===id});if(!confirm('Remove '+t.name+'? Its fixtures will be deleted too.'))return;rpc('remove_team',{team:id})}
function saveSched(f){var a=iso('s'+f),b=iso('d'+f);if(!a)return err('Choose the match date and time.');rpc('set_schedule',{f:f,sched:a,dl:b})}
function autoSched(){var a=iso('as');if(!a)return err('Choose the first match date and time.');rpc('auto_schedule',{t:S.tid,first_at:a,per_day:parseInt($('ap').value,10)||1,dl_hours:parseInt($('ah').value,10)||24})}
function copyInv(){var t=S.d.t,s=t.name+' ('+t.game+') - join here: '+location.href.split('#')[0]+'#'+t.id+' or enter code '+t.code;
  try{navigator.clipboard.writeText(s);S.msg='Invitation copied. Paste it in WhatsApp.'}catch(e){S.msg=s}render()}
function shareTable(){var d=S.d,rows=sorted(d.st),s=d.t.name+' - table\n';
  rows.forEach(function(r,i){s+=(i+1)+'. '+r.name+' P'+r.played+' GD'+r.gd+' Pts '+r.points+'\n'});
  try{navigator.clipboard.writeText(s);S.msg='Table copied. Paste it in WhatsApp.'}catch(e){S.msg=s}render()}
function sorted(a){return a.slice().sort(function(x,y){return y.points-x.points||y.gd-x.gd||y.gf-x.gf})}

var LBL={upcoming:'Upcoming',pending:'Awaiting confirmation',confirmed:'Awaiting organiser',disputed:'Disputed',verified:'Verified'};
function fxHtml(f){
  var d=S.d,tm={};d.teams.forEach(function(x){tm[x.id]=x});
  var H=tm[f.home_team],A=tm[f.away_team],u=S.user,org=u&&u.id===d.t.organiser_id;
  if(f.home_team===f.away_team)return '<div class="card row"><h3>'+esc(H.name)+'</h3><span class="tag g">Bye - goes through</span></div>';
  var mine=u&&(org||H.owner_id===u.id||A.owner_id===u.id);
  var inp='<div class="sc"><input id="h'+f.id+'" type="number" min="0" inputmode="numeric" aria-label="'+esc(H.name)+' score" value="'+(f.home_score==null?'':f.home_score)+'"><span>-</span><input id="a'+f.id+'" type="number" min="0" inputmode="numeric" aria-label="'+esc(A.name)+' score" value="'+(f.away_score==null?'':f.away_score)+'"></div>';
  var b='',over=f.deadline_at&&new Date(f.deadline_at)<new Date();
  if(f.status==='upcoming'&&mine&&over&&!org)b='<span class="bad">Deadline passed. Contact the organiser.</span>';
  else if(f.status==='upcoming'&&mine)b=inp+'<button class="sm" onclick="submit_(\''+f.id+'\')">Submit result</button>';
  else if(f.status==='pending'||f.status==='confirmed'){b='<strong>'+f.home_score+' - '+f.away_score+'</strong>';
    var side=u&&(H.owner_id===u.id||A.owner_id===u.id);
    if(f.status==='pending'&&side&&f.submitted_by!==u.id)b+='<button class="sm" onclick="confirm_(\''+f.id+'\')">Confirm score</button>';
    if(mine)b+='<button class="sm alt" onclick="dispute(\''+f.id+'\')">Dispute</button>';
    if(org)b+='<button class="sm" onclick="verify(\''+f.id+'\')">Verify result</button>';
    else if(side&&f.status==='pending'&&f.submitted_by===u.id)b+='<span class="mute">Waiting for the other side</span>';
    else if(side&&f.status==='confirmed')b+='<span class="mute">Waiting for the organiser</span>'}
  else if(f.status==='disputed'){b=org?inp+'<button class="sm" onclick="resolve(\''+f.id+'\')">Set final score</button>':'<span class="mute">Organiser is reviewing</span>'}
  else if(f.status==='verified'){b='<strong class="ok">'+f.home_score+' - '+f.away_score+'</strong>';if(f.stage==='knockout'&&f.home_score===f.away_score){if(f.ko_winner)b+='<span>Winner: '+esc(tm[f.ko_winner].name)+'</span>';else if(org)b+='<button class="sm" onclick="setWinner(\''+f.id+'\',\''+H.id+'\')">'+esc(H.name)+' won (ET/pens)</button><button class="sm" onclick="setWinner(\''+f.id+'\',\''+A.id+'\')">'+esc(A.name)+' won (ET/pens)</button>';else b+='<span class="mute">Organiser decides the winner</span>'}}
  var when=f.scheduled_at?'<div class="mute" style="margin-top:6px">Match: '+fmt(f.scheduled_at)+(f.deadline_at?'<br>Submit result by: '+fmt(f.deadline_at):'')+'</div>':'<div class="mute" style="margin-top:6px">Date and time not set yet</div>';
  var sch=org&&f.status==='upcoming'?'<details style="margin-top:10px"><summary>Set date and time</summary><div style="height:8px"></div><label for="s'+f.id+'">Match date and time</label><input id="s'+f.id+'" type="datetime-local" value="'+toLocal(f.scheduled_at)+'"><label for="d'+f.id+'">Submit result by</label><input id="d'+f.id+'" type="datetime-local" value="'+toLocal(f.deadline_at)+'"><button class="sm" onclick="saveSched(\''+f.id+'\')">Save schedule</button></details>':'';
  return '<div class="card"><div class="row"><h3>'+esc(H.name)+' v '+esc(A.name)+'</h3><span class="tag g">'+LBL[f.status]+'</span></div>'+when+'<div class="row" style="margin-top:10px;justify-content:flex-start">'+b+'</div>'+sch+'</div>'}

function authHtml(){var su=S.auth==='signup';
  return '<div class="card"><h3>'+(su?'Create your account':'Log in')+'</h3><div style="height:8px"></div>'+
  (su?'<label for="un">Username</label><input id="un" maxlength="24" autocomplete="username">':'')+
  '<label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password (6+ characters)</label><input id="pw" type="password" autocomplete="'+(su?'new':'current')+'-password">'+
  '<div class="row"><button onclick="doAuth()">'+(su?'Sign up':'Log in')+'</button><button class="alt" onclick="S.auth=\''+(su?'login':'signup')+'\';S.msg=\'\';render()">'+(su?'I have an account':'Create account')+'</button></div></div>'}

function render(){
  var el=$('app'),h='',m=S.msg?'<p class="'+(/copied|created/i.test(S.msg)?'ok':'bad')+'" role="status">'+esc(S.msg)+'</p>':'';
  var top='<div class="row"><h1>Narux Connect</h1></div>';
  if(S.view==='notes'&&S.user)h=top+notesHtml();
  else if(!S.tid)h=pageHtml(top,m);
  else if(!S.d)h=top+'<p class="sub">Loading…</p>'+m;
  else{var d=S.d,t=d.t,u=S.user,org=u&&u.id===t.organiser_id,up=d.fx.filter(function(f){return f.status==='upcoming'}),res=d.fx.filter(function(f){return f.status!=='upcoming'});
    h=top+'<div style="height:10px"></div><button class="sm alt" onclick="home()">Back to tournaments</button><div style="height:14px"></div><div class="row"><h2>'+esc(t.name)+'</h2><span class="tag">'+t.game+'</span></div>'+
    '<div class="row" style="margin:8px 0"><span class="mute">'+d.teams.length+' / '+t.max_teams+' teams - Code '+t.code+' - '+(org?'You are the organiser':'Spectator')+'</span><button class="sm alt" onclick="copyInv()">Copy invitation</button></div>'+m+
    champHtml(d)+'<div class="tabs">'+['teams','fixtures','results'].concat(t.format==='knockout'?[]:['table']).concat(['rules']).map(function(k){return '<button class="'+(S.tab===k?'on':'')+'" onclick="S.tab=\''+k+'\';S.msg=\'\';render()">'+{teams:'Teams',fixtures:'Fixtures',results:'Results',table:'Table',rules:'\uD83D\uDCDC Rules'}[k]+'</button>'}).join('')+'</div>';
    if(S.tab==='teams'){h+=newsHtml(d,org);
      if(t.status==='registration'){
        if(!u)h+='<div class="card"><p>Log in to join this tournament.</p>'+authHtml().replace('<div class="card">','<div>')+'</div>';
        else h+='<div class="card"><label for="jn">Team name</label><input id="jn" maxlength="30"><label for="ji">'+idLabel(t.game)+'</label><input id="ji" maxlength="30"><label for="jc">Country</label><select id="jc" onchange="onCountry()">'+countryOpts()+'</select><label for="jp">Phone number (visible to players in this tournament)</label><div class="row" style="flex-wrap:nowrap"><span id="pc" class="tag g">+255</span><input id="jp" type="tel" inputmode="tel" maxlength="15" style="margin:0"></div><div style="height:12px"></div>'+(org?'<label><input id="jg" type="checkbox" style="width:auto;min-height:0;margin:0 8px 0 0">Add for a player without an account</label><div style="height:12px"></div>':'')+'<button onclick="join()">Join tournament</button><p class="mute">By joining you accept the tournament rules (see the Rules tab).</p></div>'}
      h+=d.teams.length?d.teams.map(teamCard).join(''):'<div class="empty">No teams yet. Copy the invitation and share it.</div>';
      if(org&&t.status==='registration')h+=d.teams.length>=3?'<button onclick="startT()">Close registration and create fixtures</button>':'<p class="mute">Fixtures unlock when at least 3 teams have joined.</p>'}
    else if(S.tab==='fixtures')h+=stageBtn(d,org)+(org&&d.fx.length?'<div class="card"><h3>Schedule all matches</h3><p class="mute">Sets match time and result deadline for every match not yet played. You can still edit each match.</p><label for="as">First match date and time</label><input id="as" type="datetime-local"><label for="ap">Matches per day (one matchday each day)</label><input id="ap" type="number" min="1" value="2" inputmode="numeric"><label for="ah">Hours allowed to submit the result after match time</label><input id="ah" type="number" min="1" value="24" inputmode="numeric"><button onclick="autoSched()">Apply schedule</button></div>':'')+(up.length?grp(up):'<div class="empty">'+(d.fx.length?'All fixtures have results. See the Results tab.':'Fixtures appear once the organiser closes registration.')+'</div>');
    else if(S.tab==='results')h+=res.length?grp(res):'<div class="empty">No results yet.</div>';
    else if(S.tab==='rules'){h+='<div class="card"><h3>Rules and principles</h3><div style="height:8px"></div>'+(t.rules||'').split('\n').filter(Boolean).map(function(l){return '<p style="margin:0 0 8px">'+esc(l)+'</p>'}).join('')+'</div>'+(org?'<div class="card"><label for="ru">Edit rules (one per line)</label><textarea id="ru" rows="10">'+esc(t.rules||'')+'</textarea><button onclick="saveRules()">Save rules</button></div><div class="card"><h3>Danger zone</h3><p class="mute">Deleting removes the league for everyone. If matches were already verified, it is archived instead.</p><button class="alt" style="color:var(--bad)" onclick="delTour()">Delete league</button></div>':'')}
    else{h+='<div class="card wrap"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>'+
      sorted(d.st).map(function(r,i){var nn=d.st.length,z=t.qualifiers&&i<t.qualifiers?'q':(t.relegated&&i>=nn-t.relegated?'r':'');return '<tr'+(z?' class="z'+z+'"':'')+'><td>'+(i+1)+(z?' <small>'+z.toUpperCase()+'</small>':'')+'</td><td>'+esc(r.name)+'</td><td>'+r.played+'</td><td>'+r.won+'</td><td>'+r.drawn+'</td><td>'+r.lost+'</td><td>'+r.gd+'</td><td><strong>'+r.points+'</strong></td></tr>'}).join('')+'</table></div>'+legend(t)+'<p class="mute">The table counts verified results only.</p>'+awardsHtml()+'<button class="sm alt" onclick="shareTable()">Copy table for WhatsApp</button>'}}
  el.innerHTML=h;renderNav()}

sb.auth.onAuthStateChange(function(ev,session){S.user=session?session.user:null;S.msg='';render();if(S.tid&&S.d)loadT();loadNotes()});
setInterval(function(){loadNotes()},30000);
sb.auth.getSession().then(function(r){S.user=r.data.session?r.data.session.user:null;route()});
window.addEventListener('hashchange',route);
</script></body></html>
